[project]
name = "djcore"
version = "0.1.0"
description = "Offline DJ set planner and transition renderer"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "scipy",
  "librosa",
  "soundfile",
  "pydantic>=2",
  "fastapi",
  "uvicorn",
  "pyloudnorm",
  "httpx",
  "imageio-ffmpeg",
  "pyrekordbox",
  "demucs",
  "torch",
  "torchaudio",
  "mcp>=1.9,<2",
]

[project.scripts]
djcore = "djcore.adapters.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["djcore*"]

[tool.pytest.ini_options]
testpaths = ["djcore/tests"]
pythonpath = ["."]
addopts = "-q"
