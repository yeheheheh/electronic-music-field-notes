function txt(s,x,y,size=36,col=P,weight=500,font=FONT,align='left',audit=true){
 c.font=`${weight} ${size}px ${font}`;c.textAlign=align;c.textBaseline='alphabetic';c.fillStyle=col;c.fillText(s,x,y);

function wave(x,y,w,h,t,col=A,seed=1,revealP=1){
 const n=Math.round(w/7);c.save();c.beginPath();c.rect(x,y-h/2,w*revealP,h);c.clip();

 for(let i=0;i<n;i++){let z=i/n;let shape=.18+.82*Math.pow(Math.sin(z*Math.PI),.7);let v=shape*(.2+.55*hash(i+seed*300)+.25*Math.sin(i*.42+seed));v*=beat*(.65+.35*Math.abs(Math.sin(z*17-t*1.9)));rect(x+i*7,y-h*v/2,4,h*v,col)}c.restore();
}

function coverBg(w,h,gx,gy){
 rect(0,0,w,h,BG);

 g.addColorStop(0,'#181d24');g.addColorStop(1,BG);rect(0,0,w,h,g);

 for(let j=0;j<14;j++){c.beginPath();for(let x=-40;x<=w+40;x+=8){let z=x/w;let y=gy+Math.sin(z*5.3+j*.14)*h*.12+Math.sin(z*9.1-j*.2)*h*.055+j*10;if(x===-40)c.moveTo(x,y);else c.lineTo(x,y)}c.stroke()}
 c.restore();
}
function coverBars(x,y,w,h,seed=1,alpha=1){
 const n=Math.round(w/7),bw=4;
 c.save();c.globalAlpha=alpha;
 for(let i=0;i<n;i++){let z=i/n,shape=.16+.84*Math.pow(Math.sin(z*Math.PI),.75);
  let v=shape*(.16+.58*hash(i+seed*311)+.26*Math.sin(i*.43+seed*.7));
  v*= .62+.38*Math.abs(Math.sin(z*13.4+seed*.9));
  rect(x+i*7,y-h*v/2,bw,h*v,i%23===0?P:A)}
 c.restore();
}
